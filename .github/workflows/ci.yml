name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mc_owner
          POSTGRES_PASSWORD: owner_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mc_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PG: "1"
      TEST_PG_HOST: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_URL: https://api.exemplo.workers.dev

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mc_owner
          POSTGRES_PASSWORD: owner_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mc_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
