name: Capturas de tela (dados fictícios)
on:
  push:
    branches: [capturas-relatorio]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mc_owner
          POSTGRES_PASSWORD: owner_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mc_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_HOST: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npx playwright install --with-deps chromium
      - run: node tools/shots/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: tools/shots/out
          retention-days: 7
